<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Xytz Dev Studio</title>
    <style>
        :root {
            --bg-start: #dceefb;
            --bg-mid: #f5e8f2;
            --bg-end: #e8e4f8;
            --card-bg: rgba(255, 255, 255, 0.72);
            --card-border: rgba(255, 255, 255, 0.85);
            --text-primary: #4a5b7a;
            --text-secondary: #7a8aa0;
            --text-accent: #6b8fc9;
            --btn-gradient: linear-gradient(135deg, #91c4e8, #b5a3e0);
            --shadow-soft: 0 12px 40px rgba(100, 130, 180, 0.15);
            --shadow-hover: 0 20px 55px rgba(100, 130, 180, 0.25);
            --qr-bg: #ffffff;
            --radius-card: 28px;
            --radius-qr: 18px;
            --font-main: 'PingFang SC', 'Hiragino Sans GB', 'Microsoft YaHei', 'Noto Sans SC', sans-serif;
        }

        *,
        *::before,
        *::after {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        html {
            scroll-behavior: smooth;
        }

        body {
            font-family: var(--font-main);
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            background: linear-gradient(160deg, var(--bg-start) 0%, var(--bg-mid) 45%, var(--bg-end) 100%);
            background-attachment: fixed;
            overflow-x: hidden;
            position: relative;
            padding: 30px 20px 20px;
            animation: bgDrift 18s ease-in-out infinite alternate;
        }

        @keyframes bgDrift {
            0% { background-position: 0% 50%; }
            100% { background-position: 100% 50%; }
        }

        .floating-bubbles {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
            z-index: 0;
            overflow: hidden;
        }

        .bubble {
            position: absolute;
            border-radius: 50%;
            background: radial-gradient(circle at 30% 30%, rgba(255, 255, 255, 0.6), rgba(255, 255, 255, 0.1));
            box-shadow: 0 4px 20px rgba(150, 180, 220, 0.12);
            animation: bubbleFloat 14s ease-in-out infinite;
            opacity: 0.6;
        }

        .bubble:nth-child(1) { width: 80px; height: 80px; left: 5%; bottom: -10%; animation-duration: 16s; }
        .bubble:nth-child(2) { width: 50px; height: 50px; left: 12%; bottom: -15%; animation-duration: 12s; animation-delay: 2s; opacity: 0.45; }
        .bubble:nth-child(3) { width: 100px; height: 100px; left: 22%; bottom: -20%; animation-duration: 20s; animation-delay: 1s; opacity: 0.5; }
        .bubble:nth-child(4) { width: 35px; height: 35px; left: 35%; bottom: -8%; animation-duration: 10s; animation-delay: 3s; opacity: 0.4; }
        .bubble:nth-child(5) { width: 65px; height: 65px; left: 48%; bottom: -18%; animation-duration: 15s; animation-delay: 0.5s; opacity: 0.55; }
        .bubble:nth-child(6) { width: 45px; height: 45px; left: 58%; bottom: -12%; animation-duration: 11s; animation-delay: 2.5s; opacity: 0.42; }
        .bubble:nth-child(7) { width: 90px; height: 90px; left: 68%; bottom: -22%; animation-duration: 19s; animation-delay: 1.8s; opacity: 0.5; }
        .bubble:nth-child(8) { width: 40px; height: 40px; left: 78%; bottom: -10%; animation-duration: 9s; animation-delay: 0.8s; opacity: 0.38; }
        .bubble:nth-child(9) { width: 70px; height: 70px; left: 88%; bottom: -16%; animation-duration: 17s; animation-delay: 3.5s; opacity: 0.5; }
        .bubble:nth-child(10) { width: 55px; height: 55px; left: 95%; bottom: -6%; animation-duration: 13s; animation-delay: 1.5s; opacity: 0.45; }

        @keyframes bubbleFloat {
            0% { transform: translateY(0) translateX(0) scale(1); opacity: 0.3; }
            20% { opacity: 0.6; }
            50% { transform: translateY(-45vh) translateX(30px) scale(1.15); opacity: 0.5; }
            80% { opacity: 0.3; }
            100% { transform: translateY(-95vh) translateX(-20px) scale(0.9); opacity: 0; }
        }

        .sparkle {
            position: fixed;
            pointer-events: none;
            z-index: 1;
            width: 8px;
            height: 8px;
            background: rgba(255, 255, 255, 0.8);
            border-radius: 50%;
            box-shadow: 0 0 12px 3px rgba(200, 220, 255, 0.5);
            animation: sparkleTwinkle 4s ease-in-out infinite;
        }
        .sparkle:nth-child(1) { top: 10%; left: 10%; }
        .sparkle:nth-child(2) { top: 22%; left: 75%; animation-delay: 1.2s; width: 6px; height: 6px; }
        .sparkle:nth-child(3) { top: 55%; left: 8%; animation-delay: 2.5s; width: 10px; height: 10px; }
        .sparkle:nth-child(4) { top: 15%; left: 55%; animation-delay: 0.7s; width: 5px; height: 5px; }
        .sparkle:nth-child(5) { top: 70%; left: 85%; animation-delay: 1.8s; width: 7px; height: 7px; }
        .sparkle:nth-child(6) { top: 40%; left: 30%; animation-delay: 3s; }
        .sparkle:nth-child(7) { top: 8%; left: 42%; animation-delay: 2s; width: 6px; height: 6px; }
        .sparkle:nth-child(8) { top: 60%; left: 55%; animation-delay: 0.4s; width: 9px; height: 9px; }

        @keyframes sparkleTwinkle {
            0%, 100% { opacity: 0.2; transform: scale(0.6); }
            50% { opacity: 1; transform: scale(1.3); }
        }

        .main-container {
            position: relative;
            z-index: 10;
            display: flex;
            flex-direction: column;
            align-items: center;
            width: 100%;
            max-width: 520px;
            padding: 20px;
        }

        .card {
            background: var(--card-bg);
            backdrop-filter: blur(24px);
            -webkit-backdrop-filter: blur(24px);
            border-radius: var(--radius-card);
            border: 2px solid var(--card-border);
            box-shadow: var(--shadow-soft);
            padding: 42px 36px 38px;
            text-align: center;
            width: 100%;
            transition: box-shadow 0.5s ease, transform 0.5s ease;
            animation: cardAppear 1.2s ease-out forwards;
            opacity: 0;
            transform: translateY(30px) scale(0.96);
            position: relative;
            overflow: hidden;
        }

        .card::before {
            content: '';
            position: absolute;
            top: -50%;
            left: -50%;
            width: 200%;
            height: 200%;
            background: conic-gradient(from 0deg,
                    transparent 0deg,
                    rgba(255, 255, 255, 0.25) 40deg,
                    transparent 80deg,
                    transparent 160deg,
                    rgba(255, 255, 255, 0.2) 200deg,
                    transparent 240deg);
            animation: cardShimmer 8s linear infinite;
            pointer-events: none;
        }

        @keyframes cardShimmer {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }

        @keyframes cardAppear {
            0% { opacity: 0; transform: translateY(30px) scale(0.96); }
            100% { opacity: 1; transform: translateY(0) scale(1); }
        }

        .card:hover {
            box-shadow: var(--shadow-hover);
            transform: translateY(-4px);
        }

        .card-content {
            position: relative;
            z-index: 2;
        }

        .title {
            font-size: 32px;
            font-weight: 700;
            color: var(--text-primary);
            letter-spacing: 2px;
            margin-bottom: 6px;
            animation: fadeInUp 0.9s ease-out 0.3s forwards;
            opacity: 0;
            position: relative;
            display: inline-block;
        }
        .title::after {
            content: '🏡';
            position: absolute;
            top: -16px;
            right: -36px;
            font-size: 24px;
            animation: titleBounce 2.5s ease-in-out infinite;
        }
        @keyframes titleBounce {
            0%, 100% { transform: translateY(0) rotate(0deg); }
            30% { transform: translateY(-6px) rotate(-8deg); }
            60% { transform: translateY(0) rotate(5deg); }
        }

        @keyframes fadeInUp {
            0% { opacity: 0; transform: translateY(18px); }
            100% { opacity: 1; transform: translateY(0); }
        }

        .group-number-display {
            font-size: 18px;
            font-weight: 600;
            color: var(--text-accent);
            letter-spacing: 2px;
            margin-bottom: 28px;
            animation: fadeInUp 0.9s ease-out 0.5s forwards;
            opacity: 0;
        }

        .qr-wrapper {
            display: inline-block;
            position: relative;
            animation: fadeInUp 0.9s ease-out 0.7s forwards;
            opacity: 0;
            cursor: pointer;
            transition: transform 0.4s ease;
            margin-bottom: 8px;
        }
        .qr-wrapper:hover {
            transform: scale(1.04);
        }

        .qr-frame {
            background: var(--qr-bg);
            border-radius: var(--radius-qr);
            padding: 14px;
            box-shadow: 0 8px 30px rgba(90, 110, 150, 0.18);
            border: 2px solid rgba(255, 255, 255, 0.9);
            position: relative;
            transition: box-shadow 0.4s ease;
            animation: qrGlow 3.5s ease-in-out infinite;
            display: inline-block;
        }
        .qr-wrapper:hover .qr-frame {
            box-shadow: 0 12px 40px rgba(90, 110, 150, 0.28);
        }

        @keyframes qrGlow {
            0%, 100% { box-shadow: 0 8px 30px rgba(90, 110, 150, 0.18), 0 0 0 0 rgba(145, 196, 232, 0.2); }
            50% { box-shadow: 0 8px 30px rgba(90, 110, 150, 0.22), 0 0 0 12px rgba(145, 196, 232, 0.06); }
        }

        .qr-svg {
            display: block;
            width: 200px;
            height: 200px;
            border-radius: 6px;
            border: 0;
        }
        @media (max-width: 420px) {
            .qr-svg { width: 160px; height: 160px; }
            .card { padding: 30px 22px 28px; }
            .title { font-size: 26px; }
            .group-number-display { font-size: 16px; letter-spacing: 1px; }
        }

        .qr-corner {
            position: absolute;
            width: 22px;
            height: 22px;
            border: 3px solid #a0c4e8;
            pointer-events: none;
            animation: cornerPulse 2.5s ease-in-out infinite;
        }
        .qr-corner.tl { top: -6px; left: -6px; border-right: none; border-bottom: none; border-radius: 8px 0 0 0; }
        .qr-corner.tr { top: -6px; right: -6px; border-left: none; border-bottom: none; border-radius: 0 8px 0 0; }
        .qr-corner.bl { bottom: -6px; left: -6px; border-right: none; border-top: none; border-radius: 0 0 0 8px; }
        .qr-corner.br { bottom: -6px; right: -6px; border-left: none; border-top: none; border-radius: 0 0 8px 0; }
        @keyframes cornerPulse {
            0%, 100% { opacity: 0.5; transform: scale(1); }
            50% { opacity: 1; transform: scale(1.12); }
        }

        .slogan-area {
            margin-top: 22px;
            animation: fadeInUp 0.9s ease-out 0.9s forwards;
            opacity: 0;
        }

        .slogan-main {
            font-size: 18px;
            font-weight: 600;
            color: var(--text-primary);
            line-height: 1.6;
            margin-bottom: 12px;
            letter-spacing: 1px;
        }
        .slogan-main .highlight {
            color: var(--text-accent);
            background: linear-gradient(135deg, #6b8fc9, #b58fc9);
            -webkit-background-clip: text;
            background-clip: text;
            -webkit-text-fill-color: transparent;
            font-weight: 700;
        }

        .slogan-sub {
            font-size: 14px;
            color: var(--text-secondary);
            line-height: 1.8;
            letter-spacing: 1px;
            max-width: 340px;
            margin: 0 auto;
        }
        .slogan-sub .emoji {
            font-style: normal;
            display: inline-block;
            animation: emojiWiggle 2.2s ease-in-out infinite;
        }
        .slogan-sub .emoji:nth-child(2) { animation-delay: 0.3s; }
        .slogan-sub .emoji:nth-child(3) { animation-delay: 0.6s; }
        @keyframes emojiWiggle {
            0%, 100% { transform: rotate(0deg); }
            25% { transform: rotate(10deg) scale(1.1); }
            75% { transform: rotate(-8deg) scale(1.05); }
        }

        .sponsor-section {
            position: relative;
            z-index: 10;
            margin-top: 32px;
            text-align: center;
            animation: fadeInUp 0.9s ease-out 1.2s forwards;
            opacity: 0;
        }

        .sponsor-link {
            display: inline-flex;
            align-items: center;
            gap: 10px;
            padding: 14px 32px;
            background: var(--btn-gradient);
            background-size: 200% 200%;
            color: #fff;
            text-decoration: none;
            font-size: 16px;
            font-weight: 600;
            letter-spacing: 2px;
            border-radius: 40px;
            box-shadow: 0 8px 24px rgba(145, 160, 200, 0.3);
            transition: all 0.4s ease;
            border: none;
            cursor: pointer;
            position: relative;
            overflow: hidden;
            animation: btnGradientShift 4s ease-in-out infinite;
        }
        .sponsor-link::before {
            content: '';
            position: absolute;
            top: -50%;
            left: -60%;
            width: 40%;
            height: 200%;
            background: rgba(255, 255, 255, 0.25);
            transform: rotate(25deg);
            transition: left 0.6s ease;
        }
        .sponsor-link:hover::before { left: 120%; }
        .sponsor-link:hover {
            transform: translateY(-4px) scale(1.03);
            box-shadow: 0 14px 35px rgba(145, 160, 200, 0.4);
            background-position: 100% 50%;
        }
        .sponsor-link:active { transform: translateY(-1px) scale(0.98); }

        @keyframes btnGradientShift {
            0%, 100% { background-position: 0% 50%; }
            50% { background-position: 100% 50%; }
        }

        .sponsor-link .heart {
            display: inline-block;
            animation: heartBeat 1.6s ease-in-out infinite;
            font-size: 20px;
        }
        @keyframes heartBeat {
            0%, 100% { transform: scale(1); }
            30% { transform: scale(1.3); }
            50% { transform: scale(1.1); }
            70% { transform: scale(1.25); }
        }

        @media (max-width: 480px) {
            .card { padding: 28px 20px 26px; border-radius: 22px; }
            .title { font-size: 24px; }
            .title::after { font-size: 18px; top: -12px; right: -28px; }
            .group-number-display { font-size: 15px; margin-bottom: 20px; }
            .slogan-main { font-size: 15px; }
            .slogan-sub { font-size: 12px; }
            .sponsor-link { padding: 12px 24px; font-size: 14px; }
            .qr-svg { width: 150px; height: 150px; }
            .qr-frame { padding: 10px; }
        }

        @media (max-width: 360px) {
            .qr-svg { width: 130px; height: 130px; }
            .card { padding: 22px 14px 20px; }
            .title { font-size: 20px; }
        }

        @media (min-width: 768px) {
            .main-container { max-width: 560px; }
            .qr-svg { width: 220px; height: 220px; }
            .title { font-size: 36px; }
        }
    </style>
</head>
