<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>赞助-CBs2N</title>
    <style>
        :root {
            --white: #ffffff;
            --soft-blue: #e8f0fe;
            --light-blue: #d4e4ff;
            --blue: #a8c8f8;
            --deep-blue: #6b9fd4;
            --lavender: #e6e0f8;
            --light-lavender: #f0ebff;
            --pink: #fce4ec;
            --light-pink: #fff0f5;
            --soft-pink: #f8d7e5;
            --text-primary: #3a3a5c;
            --text-secondary: #6b6b8a;
            --text-light: #9a9ab8;
            --card-shadow: 0 20px 60px rgba(107, 159, 212, 0.15), 0 8px 24px rgba(107, 159, 212, 0.1);
            --card-shadow-hover: 0 24px 70px rgba(107, 159, 212, 0.22), 0 12px 32px rgba(107, 159, 212, 0.14);
            --border-radius-lg: 28px;
            --border-radius-md: 18px;
            --border-radius-sm: 12px;
            --transition: all 0.35s cubic-bezier(0.4, 0, 0.2, 1);
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'PingFang SC', 'Microsoft YaHei', 'Segoe UI', 'Helvetica Neue', sans-serif;
            min-height: 100vh;
            background: linear-gradient(160deg,
                    #fdfdff 0%,
                    #f5f8ff 20%,
                    #f0edff 40%,
                    #fff5f8 60%,
                    #f8f9ff 80%,
                    #ffffff 100%);
            background-attachment: fixed;
            color: var(--text-primary);
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            padding: 40px 20px;
            position: relative;
            overflow-x: hidden;
        }

        /* 装饰性浮动粒子 */
        .particle {
            position: fixed;
            border-radius: 50%;
            pointer-events: none;
            opacity: 0.4;
            filter: blur(2px);
            animation: floatParticle 15s infinite ease-in-out;
            z-index: 0;
        }

        .particle:nth-child(1) {
            width: 180px;
            height: 180px;
            background: radial-gradient(circle, #d4e4ff 0%, transparent 70%);
            top: -40px;
            left: -40px;
            animation-delay: 0s;
            animation-duration: 18s;
        }

        .particle:nth-child(2) {
            width: 220px;
            height: 220px;
            background: radial-gradient(circle, #e6e0f8 0%, transparent 70%);
            top: 30%;
            right: -60px;
            animation-delay: -5s;
            animation-duration: 20s;
        }

        .particle:nth-child(3) {
            width: 160px;
            height: 160px;
            background: radial-gradient(circle, #fce4ec 0%, transparent 70%);
            bottom: -30px;
            left: 20%;
            animation-delay: -10s;
            animation-duration: 16s;
        }

        .particle:nth-child(4) {
            width: 140px;
            height: 140px;
            background: radial-gradient(circle, #d4e4ff 0%, transparent 70%);
            bottom: 10%;
            right: 15%;
            animation-delay: -3s;
            animation-duration: 22s;
        }

        .particle:nth-child(5) {
            width: 100px;
            height: 100px;
            background: radial-gradient(circle, #f8d7e5 0%, transparent 70%);
            top: 15%;
            left: 35%;
            animation-delay: -7s;
            animation-duration: 14s;
        }

        @keyframes floatParticle {
            0%,
            100% {
                transform: translate(0, 0) scale(1);
            }
            25% {
                transform: translate(30px, -40px) scale(1.1);
            }
            50% {
                transform: translate(-20px, 30px) scale(0.9);
            }
            75% {
                transform: translate(15px, 50px) scale(1.05);
            }
        }

        .container {
            position: relative;
            z-index: 1;
            max-width: 900px;
            width: 100%;
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        /* 顶部区域 */
        .header {
            text-align: center;
            margin-bottom: 40px;
            animation: fadeInDown 0.8s ease-out;
        }

        @keyframes fadeInDown {
            from {
                opacity: 0;
                transform: translateY(-30px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        .header h1 {
            font-size: 3.2rem;
            font-weight: 700;
            line-height: 1.2;
            background: linear-gradient(135deg, #5b7fa6 0%, #8b7ec8 40%, #d489a8 80%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
            letter-spacing: -0.5px;
            margin-bottom: 0;
        }

        /* 分割线装饰 */
        .divider {
            display: flex;
            align-items: center;
            gap: 16px;
            margin: 10px 0 45px;
            animation: fadeIn 1s ease-out 0.3s both;
        }

        .divider .line {
            width: 120px;
            height: 2px;
            background: linear-gradient(90deg, transparent, rgba(107, 159, 212, 0.5));
            border-radius: 2px;
        }

        .divider .line:last-child {
            background: linear-gradient(90deg, rgba(107, 159, 212, 0.5), transparent);
        }

        .divider .diamond {
            width: 8px;
            height: 8px;
            background: var(--deep-blue);
            border-radius: 2px;
            transform: rotate(45deg);
            opacity: 0.6;
        }

        @keyframes fadeIn {
            from {
                opacity: 0;
            }
            to {
                opacity: 1;
            }
        }

        /* 收款码区域 - 最显眼位置 */
        .qr-section {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 32px;
            margin-bottom: 50px;
            width: 100%;
            animation: fadeInUp 0.8s ease-out 0.2s both;
        }

        @keyframes fadeInUp {
            from {
                opacity: 0;
                transform: translateY(40px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        .qr-card {
            background: rgba(255, 255, 255, 0.75);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            border-radius: var(--border-radius-lg);
            padding: 35px 30px 30px;
            text-align: center;
            box-shadow: var(--card-shadow);
            border: 1.5px solid rgba(255, 255, 255, 0.8);
            transition: var(--transition);
            position: relative;
            overflow: hidden;
            cursor: pointer;
        }

        .qr-card::before {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            height: 4px;
            border-radius: var(--border-radius-lg) var(--border-radius-lg) 0 0;
            transition: var(--transition);
        }

        .qr-card.wechat::before {
            background: linear-gradient(90deg, #07c160, #4cd964);
        }

        .qr-card.alipay::before {
            background: linear-gradient(90deg, #1677ff, #4ea1ff);
        }

        .qr-card:hover {
            transform: translateY(-8px);
            box-shadow: var(--card-shadow-hover);
            border-color: rgba(255, 255, 255, 1);
        }

        .qr-card h3 {
            font-size: 1.6rem;
            font-weight: 600;
            color: var(--text-primary);
            margin-bottom: 22px;
            letter-spacing: 0.5px;
        }

        .qr-image-placeholder {
            width: 100%;
            max-width: 260px;
            aspect-ratio: 1 / 1;
            margin: 0 auto;
            border-radius: var(--border-radius-md);
            display: flex;
            align-items: center;
            justify-content: center;
            position: relative;
            background: linear-gradient(135deg, #fafafa, #f0f0f5);
            border: 2px dashed rgba(107, 159, 212, 0.4);
            transition: var(--transition);
            overflow: hidden;
        }

        .qr-card:hover .qr-image-placeholder {
            border-color: rgba(107, 159, 212, 0.7);
            background: linear-gradient(135deg, #fefefe, #f5f5fa);
        }

        .qr-image-placeholder .placeholder-content {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 12px;
            color: var(--text-light);
            font-size: 0.95rem;
            letter-spacing: 0.5px;
            text-align: center;
            padding: 20px;
        }

        .qr-image-placeholder .placeholder-icon {
            width: 60px;
            height: 60px;
            border-radius: 14px;
            background: rgba(107, 159, 212, 0.08);
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 32px;
            transition: var(--transition);
        }

        .qr-card:hover .placeholder-icon {
            background: rgba(107, 159, 212, 0.15);
            transform: scale(1.1);
        }

        .qr-image-placeholder .hint-text {
            font-size: 0.8rem;
            color: var(--text-light);
            opacity: 0.7;
            letter-spacing: 0.5px;
        }

        /* 实际收款码图片（替换占位符） */
        .qr-image-placeholder img {
            width: 100%;
            height: 100%;
            object-fit: cover;
            border-radius: var(--border-radius-md);
            display: block;
        }

        /* 底部信息 */
        .footer {
            margin-top: 40px;
            text-align: center;
            font-size: 0.85rem;
            color: var(--text-light);
            letter-spacing: 1px;
            animation: fadeIn 1s ease-out 0.5s both;
        }

        /* 响应式设计 */
        @media (max-width: 768px) {
            body {
                padding: 24px 16px;
            }
            .header h1 {
                font-size: 2.4rem;
            }
            .qr-section {
                grid-template-columns: 1fr;
                gap: 24px;
            }
            .qr-card {
                padding: 28px 20px 24px;
            }
            .qr-image-placeholder {
                max-width: 220px;
            }
            .divider .line {
                width: 60px;
            }
        }

        @media (max-width: 400px) {
            .header h1 {
                font-size: 1.8rem;
            }
            .qr-card h3 {
                font-size: 1.3rem;
            }
            .qr-image-placeholder {
                max-width: 180px;
            }
        }
    </style>
</head>
<body>
    <!-- 装饰粒子 -->
    <div class="particle"></div>
    <div class="particle"></div>
    <div class="particle"></div>
    <div class="particle"></div>
    <div class="particle"></div>

    <div class="container">
        <!-- 顶部标题 -->
        <div class="header">
            <h1>赞助</h1>
        </div>

        <!-- 分割线 -->
        <div class="divider">
            <div class="line"></div>
            <div class="diamond"></div>
            <div class="line"></div>
        </div>

        <!-- 收款码区域 - 最显眼位置 -->
        <div class="qr-section">
            <!-- 微信收款码 -->
            <div class="qr-card wechat" id="wechatCard" title="微信收款码">
                <h3>微信</h3>
                <div class="qr-image-placeholder" id="wechatQR">
                    <!-- 占位内容将由 JavaScript 替换 -->
                </div>
            </div>

            <!-- 支付宝收款码 -->
            <div class="qr-card alipay" id="alipayCard" title="支付宝收款码">
                <h3>支付宝</h3>
                <div class="qr-image-placeholder" id="alipayQR">
                    <!-- 占位内容将由 JavaScript 替换 -->
                </div>
            </div>
        </div>

        <!-- 底部 -->
        <div class="footer">
            <p>Powered By CBs2N</p>
        </div>
    </div>

    <script>
        (function() {
            // ============================================
            // 配置区域 - 已填入您的收款码链接
            // ============================================
            const CONFIG = {
                // 微信收款码图片地址
                wechatQR: "https://img.remit.ee/api/file/BQACAgUAAyEGAASHRsPbAAEZeG5qhZPWNZ83hscVnF5VBBiSoQ3-zAACQzAAArakKVT_Qg7wHZB_Bz0E.png",
                // 支付宝收款码图片地址
                alipayQR: "https://img.remit.ee/api/file/BQACAgUAAyEGAASHRsPbAAEZeHJqhZQGh2yKuCJme1cIZqcnWZbm2gACRzAAArakKVTtqH05w0Q28z0E.jpg",
            };

            // 替换微信收款码
            const wechatContainer = document.getElementById('wechatQR');
            if (wechatContainer) {
                wechatContainer.innerHTML = '';
                const img = document.createElement('img');
                img.src = CONFIG.wechatQR;
                img.alt = '微信收款码';
                img.style.width = '100%';
                img.style.height = '100%';
                img.style.objectFit = 'cover';
                img.style.borderRadius = '18px';
                img.style.display = 'block';
                wechatContainer.appendChild(img);
            }

            // 替换支付宝收款码
            const alipayContainer = document.getElementById('alipayQR');
            if (alipayContainer) {
                alipayContainer.innerHTML = '';
                const img = document.createElement('img');
                img.src = CONFIG.alipayQR;
                img.alt = '支付宝收款码';
                img.style.width = '100%';
                img.style.height = '100%';
                img.style.objectFit = 'cover';
                img.style.borderRadius = '18px';
                img.style.display = 'block';
                alipayContainer.appendChild(img);
            }

            // 点击卡片放大查看收款码
            const wechatCard = document.getElementById('wechatCard');
            const alipayCard = document.getElementById('alipayCard');

            function handleCardClick(cardId) {
                const card = document.getElementById(cardId);
                if (!card) return;
                card.addEventListener('click', function() {
                    const img = card.querySelector('.qr-image-placeholder img');
                    if (img) {
                        const overlay = document.createElement('div');
                        overlay.style.cssText = `
                            position: fixed;
                            inset: 0;
                            background: rgba(0,0,0,0.6);
                            backdrop-filter: blur(8px);
                            display: flex;
                            align-items: center;
                            justify-content: center;
                            z-index: 9999;
                            cursor: zoom-out;
                            animation: fadeIn 0.3s ease-out;
                        `;
                        const imgClone = img.cloneNode(true);
                        imgClone.style.cssText = `
                            max-width: min(80vw, 500px);
                            max-height: 80vh;
                            border-radius: 20px;
                            box-shadow: 0 30px 80px rgba(0,0,0,0.4);
                            object-fit: contain;
                            animation: zoomIn 0.4s ease-out;
                        `;
                        overlay.appendChild(imgClone);
                        overlay.addEventListener('click', () => overlay.remove());
                        document.body.appendChild(overlay);
                    }
                });
            }

            // 添加动画
            const styleSheet = document.createElement('style');
            styleSheet.textContent = `
                @keyframes zoomIn {
                    from { opacity: 0; transform: scale(0.7); }
                    to { opacity: 1; transform: scale(1); }
                }
            `;
            document.head.appendChild(styleSheet);

            handleCardClick('wechatCard');
            handleCardClick('alipayCard');

            // 键盘无障碍支持
            [wechatCard, alipayCard].forEach(card => {
                if (card) {
                    card.setAttribute('role', 'button');
                    card.setAttribute('tabindex', '0');
                    card.addEventListener('keydown', function(e) {
                        if (e.key === 'Enter' || e.key === ' ') {
                            e.preventDefault();
                            card.click();
                        }
                    });
                }
            });
        })();
    </script>
</body>
</html>
